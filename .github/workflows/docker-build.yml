name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'citadel_bot/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/citadel_bot:latest
            ${{ secrets.DOCKER_USERNAME }}/citadel_bot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Image pushed successfully
        run: |
          echo "Image pushed: ${{ secrets.DOCKER_USERNAME }}/citadel_bot:latest"
          echo "SHA tag: ${{ secrets.DOCKER_USERNAME }}/citadel_bot:${{ github.sha }}"